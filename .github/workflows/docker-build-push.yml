name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: true
        default: "latest"
        type: string
      platform:
        description: "Target platform architecture (default: linux/amd64)"
        required: true
        default: "linux/amd64"
        type: string
  push:
    branches:
      - main
      - master
      - delta
      - dev
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docmost Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER}/docmost"
          CUSTOM_TAG="${{ inputs.tag || 'latest' }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          TAGS="${GHCR_IMAGE}:${CUSTOM_TAG},${GHCR_IMAGE}:${SHORT_SHA}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${GHCR_IMAGE}:${REF_TAG}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Tags to push: ${TAGS}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platform || 'linux/amd64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=docmost
          cache-to: type=gha,mode=max,scope=docmost
